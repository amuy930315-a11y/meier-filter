<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Success | Meier Filter</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      font-family: Arial, "Noto Sans TC", sans-serif;

      color: #4f433d;

      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.95), rgba(255,255,255,0.2)),
        linear-gradient(135deg, #fffdf9, #f6eee8);
    }

    .success-card {
      width: 100%;
      max-width: 620px;

      padding: 60px 40px;

      text-align: center;

      background: rgba(255, 255, 255, 0.72);

      border: 1px solid rgba(115, 84, 65, 0.10);
      border-radius: 24px;

      backdrop-filter: blur(10px);

      box-shadow: 0 20px 50px rgba(80, 60, 45, 0.08);
    }

    .small-title {
      margin-bottom: 14px;

      font-size: 10px;

      letter-spacing: 5px;

      color: #9b877c;
    }

    h1 {
      margin-bottom: 14px;

      font-family: Georgia, "Times New Roman", serif;

      font-size: 38px;
      font-weight: 400;

      letter-spacing: 2px;
    }

    .cn-title {
      margin-bottom: 35px;

      font-size: 16px;

      letter-spacing: 3px;

      color: #806e64;
    }

    .product-box {
  margin: 0 auto 30px;
  padding: 22px;
  max-width: 420px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;

  border-top: 1px solid rgba(115, 84, 65, 0.15);
  border-bottom: 1px solid rgba(115, 84, 65, 0.15);
}

.product-thumb {
  width: 78px;
  height: 78px;
  object-fit: cover;
  flex-shrink: 0;
  border-radius: 6px;
}

.product-text {
  text-align: left;
}

.product-box p {
  margin: 5px 0;
  font-size: 14px;
  line-height: 1.6;
}

    .notice {
      margin-bottom: 30px;

      font-size: 13px;

      line-height: 2;

      color: #6e625b;
    }

    .line-btn,
    .home-btn {
      display: inline-block;

      margin: 6px;

      padding: 13px 24px;

      border-radius: 30px;

      font-size: 13px;

      text-decoration: none;
    }

    .line-btn {
      background: #735441;
      color: white;
    }

    .home-btn {
      border: 1px solid #735441;
      color: #735441;
      background: rgba(255,255,255,0.45);
    }

    .footer-note {
      margin-top: 28px;

      font-size: 10px;

      letter-spacing: 2px;

      color: #aa9d95;
    }

    @media (max-width: 600px) {
      .success-card {
        padding: 45px 24px;
      }

      h1 {
        font-size: 30px;
      }

      .line-btn,
      .home-btn {
        display: block;

        width: 100%;

        margin: 10px 0;
      }
    }
  </style>
</head>

<body>

  <main class="success-card">

    <p class="small-title">
      PAYMENT SUCCESS
    </p>

    <h1>
      Thank You ♡
    </h1>

    <p class="cn-title">
      付款完成
    </p>

<div class="product-box">

  <img
    src="images/creamy-day-thumb.jpg"
    alt="CREAMY DAY 奶油日光"
    class="product-thumb"
  >

  <div class="product-text">
    <p>CREAMY DAY｜奶油日光</p>
    <p>NT$150</p>
  </div>

</div>

    <p class="notice">
      感謝您的購買 ♡<br>
      請點擊下方 LINE 按鈕聯絡我，並提供您的 Gmail。<br>
      確認付款資訊後，將提供濾鏡檔案給您。
    </p>

    <a
      href="https://line.me/R/oaMessage/%40228ofnxi/?我已完成付款%20CREAMY%20DAY"
      class="line-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      聯絡 LINE 領取濾鏡
    </a>

    <a
      href="index.html"
      class="home-btn"
    >
      回到首頁
    </a>

    <p class="footer-note">
      MEIER FILTER & PRESET
    </p>

  </main>

</body>

</html>
