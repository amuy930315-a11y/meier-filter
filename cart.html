
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CART｜MEIER FILTER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #756553;
      font-family: Georgia, "Microsoft JhengHei", sans-serif;
      background:
        linear-gradient(rgba(250,248,244,.45), rgba(250,248,244,.45)),
        url("images/snow-bg.png") center top / cover fixed;
    }

    .shop-header {
      height: 78px;
      padding: 0 5%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid #eee9e4;
    }

    .back-home,
    .cart-link {
      display: flex;
      align-items: center;
      color: #4f4a46;
      text-decoration: none;
      min-width: 44px;
      min-height: 44px;
    }

    .back-home {
      justify-self: start;
    }

    .shop-logo {
      justify-self: center;
    }

    .shop-logo img {
      display: block;
      width: 92px;
      height: auto;
    }

    .cart-link {
      justify-self: end;
      gap: 5px;
      font-size: 11px;
    }

    .back-home svg,
    .cart-link svg {
      width: 23px;
      height: 23px;
      stroke: currentColor;
    }

    .cart-page {
      width: 90%;
      max-width: 760px;
      margin: 65px auto 100px;
    }

    .cart-heading {
      text-align: center;
      margin-bottom: 45px;
    }

    .cart-heading h1 {
      margin: 0 0 12px;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 7px;
    }

    .cart-heading p {
      font-size: 10px;
      letter-spacing: 3px;
      color: #aa9986;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
      border-bottom: 1px solid #e4ddd4;
    }

    .cart-item img {
      width: 90px;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee9e1;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-info h2 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 1px;
      margin: 0 0 8px;
    }

    .item-info p {
      font-size: 12px;
      color: #a99a89;
      margin: 0 0 10px;
    }

    .item-price {
      font-size: 13px;
    }

    .remove-btn {
      border: none;
      background: transparent;
      color: #a99a89;
      font-size: 12px;
      cursor: pointer;
      padding: 10px;
    }

    .remove-btn:hover {
      color: #756553;
    }

    .cart-summary {
      margin-top: 35px;
      padding: 25px;
      background: rgba(255,255,255,.88);
      border: 1px solid #eee9e4;
      border-radius: 14px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .checkout-btn {
      width: 100%;
      padding: 16px;
      background: #756553;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .checkout-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .continue-shopping {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #756553;
      font-size: 12px;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .empty-cart {
      text-align: center;
      padding: 65px 15px;
      color: #a99a89;
      font-size: 14px;
      line-height: 2;
    }

    @media (max-width: 600px) {
      .shop-header {
        height: 65px;
        padding: 0 18px;
      }

      .shop-logo img {
        width: 80px;
      }

      .cart-page {
        width: 92%;
        margin-top: 45px;
      }

      .cart-heading h1 {
        font-size: 27px;
      }

      .cart-item {
        gap: 12px;
      }

      .cart-item img {
        width: 75px;
        height: 95px;
      }

      .item-info h2 {
        font-size: 12px;
      }
    }
    .checkout-email { 
  margin-bottom: 24px; 
} 
 
.checkout-email label { 
  display: block; 
  margin-bottom: 10px; 
  font-size: 13px; 
} 
 
.checkout-email input { 
  width: 100%; 
  padding: 15px; 
  border: 1px solid #ded6cc; 
  border-radius: 8px; 
  background: white; 
  color: #756553; 
  font-size: 14px; 
  outline: none; 
} 
 
.checkout-email input:focus { 
  border-color: #978775; 
} 
 
.checkout-email p, 
.payment-security p { 
  font-size: 11px; 
  color: #a99a89; 
  line-height: 1.9; 
} 
 
.payment-security { 
  margin-top: 25px; 
  text-align: center; 
}
  </style>
</head>

<body>

  <header class="shop-header">

    <a href="shop.html" class="back-home" aria-label="返回商店">
      <svg viewBox="0 0 24 24" fill="none"
           stroke-width="1.5" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </a>

    <a href="index.html" class="shop-logo">
      <img src="images/logo.png" alt="MEIER FILTER">
    </a>


  </header>

  <main class="cart-page">

    <div class="cart-heading">
      <h1>MY CART</h1>
      <p>YOUR FAVORITE MOODS ♡</p>
    </div>

    <div id="cart-items"></div>

    <div class="cart-summary" id="cart-summary">
      <div class="total-row">
        <span>總計</span>
        <span id="cart-total">NT$0</span>
      </div>

      <div class="checkout-email">
  <label for="customer-email">收件電子郵件 Email</label>
  <input
    type="email"
    id="customer-email"
    placeholder="example@gmail.com"
    autocomplete="email"
    required
  >
  <p>付款成功後，濾鏡 DNG 檔案的下載資訊將寄送至此信箱。</p>
</div>

<button class="checkout-btn" id="checkout-btn" disabled>
  前往綠界安全付款
</button>

<div class="payment-security">
  <p>🔒 綠界 ECPay 安全金流</p>
  <p>付款資訊由綠界處理，本站不儲存信用卡資料。</p>
  <p>請確認電子郵件正確，以免無法收到商品。</p>
  <p>付款問題請聯絡 Instagram：@meier.share</p>
</div>

    <a href="shop.html" class="continue-shopping">
      ← 繼續選購濾鏡
    </a>

  </main>

  <script src="products.js"></script>

  <script>
    const CART_KEY = "meier-cart";

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem(CART_KEY));
        return Array.isArray(cart) ? cart : [];
      } catch {
        return [];
      }
    }

    function getProduct(item) {
      const id = item && typeof item === "object"
        ? item.id
        : item;

      const catalog = typeof PRODUCTS !== "undefined"
        ? PRODUCTS
        : null;

      let product = null;

      if (Array.isArray(catalog)) {
        product = catalog.find(p => String(p.id) === String(id));
      } else if (catalog && typeof catalog === "object") {
        product = catalog[id] || Object.values(catalog).find(
          p => String(p.id) === String(id)
        );
      }

      return {
        ...(product || {}),
        ...(item && typeof item === "object" ? item : {}),
        id
      };
    }

    function renderCart() {
      const cart = getCart();
      const uniqueCart = cart.filter((item, index, arr) => {
        const id = item && typeof item === "object" ? item.id : item;
        return index === arr.findIndex(p =>
          String(p && typeof p === "object" ? p.id : p) === String(id)
        );
      });

      const container = document.getElementById("cart-items");
      const count = document.getElementById("cart-count");
      const totalElement = document.getElementById("cart-total");
      const checkoutBtn = document.getElementById("checkout-btn");

     if (count) {
  count.textContent = uniqueCart.length;
}
      container.innerHTML = "";

      if (uniqueCart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            ♡<br>
            你的購物車目前是空的<br>
            快去挑選喜歡的濾鏡吧！
          </div>
        `;
        totalElement.textContent = "NT$0";
        checkoutBtn.disabled = true;
        return;
      }

      let total = 0;

      uniqueCart.forEach(item => {
        const product = getProduct(item);
        const price = Number(product.price ?? 150) || 0;
        total += price;

        const row = document.createElement("div");
        row.className = "cart-item";

       
const img = document.createElement("img");

const productImages = {
  "creamy-day": "images/creamy-day.jpg",
  "color-breeze": "images/color-breeze.jpg",
  "golden-day": "images/golden-day-product.png",
  "disney-day": "images/disney-day-product.jpg",
  "cream-haze": "images/cream-haze-product.jpg",
  "grey-haze": "images/grey-haze-product.jpg",
  "lilac-day": "images/lilac-day-product.jpg",
  "maple-day": "images/maple-day-product.jpg",
  "milky-sage": "images/milky-sage/cover.jpg",
  "cocoa-caramel": "images/cocoa-caramel/cover.jpg"
};

const productId = String(product.id || "")
  .trim()
  .toLowerCase();

img.src =
  productImages[productId] ||
  product.image ||
  product.cover ||
  product.img ||
  "";

img.alt = product.name || "濾鏡商品";


        const info = document.createElement("div");
        info.className = "item-info";

        const name = document.createElement("h2");
        name.textContent = product.name || product.title || product.id || "濾鏡商品";

        const subtitle = document.createElement("p");
        subtitle.textContent = product.chineseName || product.subtitle || "";

        const priceElement = document.createElement("span");
        priceElement.className = "item-price";
        priceElement.textContent = `NT$${price}`;

        info.append(name, subtitle, priceElement);

        const remove = document.createElement("button");
        remove.className = "remove-btn";
        remove.type = "button";
        remove.textContent = "移除";
        remove.addEventListener("click", () => {
          const updated = getCart().filter(p => {
            const id = p && typeof p === "object" ? p.id : p;
            return String(id) !== String(product.id);
          });

          localStorage.setItem(CART_KEY, JSON.stringify(updated));
          renderCart();
        });

        row.append(img, info, remove);
        container.appendChild(row);
      });

      totalElement.textContent = `NT$${total}`;
      checkoutBtn.disabled = false;
    }

    
document.getElementById("checkout-btn").addEventListener("click", function () {

  const email = document
    .getElementById("customer-email")
    .value
    .trim();

  const emailInput = document.getElementById("customer-email");

  if (!emailInput.checkValidity()) {
    emailInput.reportValidity();
    return;
  }

  const cart = getCart();

  const cartIds = [
    ...new Set(
      cart.map(item =>
        typeof item === "string" ? item : item.id
      )
    )
  ].filter(Boolean);

  if (cartIds.length === 0) {
    alert("購物車目前沒有商品");
    return;
  }

  // 建立 POST 表單，送往 Netlify 付款功能
  const form = document.createElement("form");

  form.method = "POST";
  form.action = "/.netlify/functions/create-payment";

  const cartField = document.createElement("input");
  cartField.type = "hidden";
  cartField.name = "cart";
  cartField.value = JSON.stringify(cartIds);

  const emailField = document.createElement("input");
  emailField.type = "hidden";
  emailField.name = "email";
  emailField.value = email;

  form.appendChild(cartField);
  form.appendChild(emailField);

  document.body.appendChild(form);

  form.submit();

});


function addProductFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const productId = params.get("add");

  if (!productId) return;

  const product = PRODUCTS.find(p => p.id === productId);

  if (!product) {
    console.warn("找不到商品：", productId);
    return;
  }

  const cart = getCart();

  const exists = cart.some(item => {
    const id = typeof item === "string" ? item : item.id;
    return id === productId;
  });

  if (!exists) {
    cart.push(product);
    localStorage.setItem("meier-cart", JSON.stringify(cart));
  }

  // 移除網址參數，避免重新整理時重複加入
  window.history.replaceState(
    {},
    "",
    window.location.pathname
  );
}

addProductFromUrl();

    renderCart();
  </script>

</body>
</html>
